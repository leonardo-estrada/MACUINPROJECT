<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - MACUIN</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='CSS/login.css') }}" />
  <style>
    .form-control {
      width: 100%;
      padding: 10px;
      border: 1px solid #CBD5E0;
      border-radius: 6px;
      font-size: 14px;
    }

    .form-control:focus {
      outline: none;
      border-color: #8B1538;
      box-shadow: 0 0 0 3px rgba(139, 21, 56, 0.1);
    }
  </style>
</head>

<body>
  <div class="login-page">
    <div class="logo-section">
      <img src="{{ url_for('static', filename='IMG/logo2.png') }}" alt="Logo MACUIN" class="logo-img">

      <p>Sistema de Gestión de Autopartes</p>
    </div>

    <div class="login-card">
      <div class="card-header">
        <h2>Iniciar Sesión</h2>
        <p>Sistema de Gestión de Autopartes</p>
      </div>

      <form action="/" method="POST" class="login-form">

        <div class="form-group">
          <label for="correo">Correo Electrónico</label>
          <input class="form-control" type="email" id="correo" name="correo" placeholder="ejemplo@macuin.com" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input class="form-control" type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="form-actions">
          <button type="submit" class="login-btn">Iniciar Sesión</button>
        </div>

        {% with messages = get_flashed_messages(category_filter=["error"]) %}
        {% if messages %}
        <div class="error-message"
          style="color: #E53E3E; text-align: center; margin-top: 15px; font-weight: 600; font-size: 0.9rem;">
          <i class="fas fa-exclamation-circle"></i> {{ messages[0] }}
        </div>
        {% endif %}
        {% endwith %}

      </form>

      <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('pass1') }}" class="forgot-password"
          style="color: #6B0F2A; text-decoration: none; font-size: 0.9rem;">
          ¿Olvidó su contraseña?
        </a>
      </div>
      </form>

      <p class="footer-text">
        El rol se asigna automáticamente según sus credenciales.
      </p>
    </div>
  </div>
</body>

</html>
