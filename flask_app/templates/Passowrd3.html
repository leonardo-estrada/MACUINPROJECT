<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - MACUIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/Password3.css') }}" />
</head>
<body>
    <div class="auth-container">
         <div class="logo-section">
      <img src="{{ url_for('static', filename='IMG/logo2.png') }}" alt="Logo MACUIN" class="logo-img">
      <p>Sistema de Gestión de Autopartes</p>
    </div>
        <div class="auth-card">
            <div class="stepper">
                <div class="step completed">
                    <div class="step-number"><i class="fas fa-check"></i></div>
                    <span class="step-label">Correo</span>
                </div>
                <div class="step-line active"></div>
                <div class="step completed">
                    <div class="step-number"><i class="fas fa-check"></i></div>
                    <span class="step-label">Verificación</span>
                </div>
                <div class="step-line active"></div>
                <div class="step active">
                    <div class="step-number">3</div>
                    <span class="step-label">Nueva clave</span>
                </div>
            </div>
            <div class="recovery-icon"><i class="fas fa-lock"></i></div>
            <h2 class="auth-title-small">Crear nueva contraseña</h2>
            <p class="auth-description">Elige una contraseña segura para tu cuenta.</p>
            
            <form action="{{ url_for('pass3') }}" method="POST" class="auth-form">
                <div class="form-group" style="text-align: left; margin-bottom: 20px;">
                    <label for="new-password">Nueva contraseña</label>
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="new-password" name="password" placeholder="••••••••" minlength="6" required style="width: 100%; padding: 10px 10px 10px 35px; border-radius: 5px; border: 1px solid #ccc;">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full" style="width: 100%; padding: 12px; background-color: #2F855A; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px;">
                    <i class="fas fa-shield-alt"></i> Establecer nueva contraseña
                </button>
            </form>

            <a href="{{ url_for('login') }}" class="back-link" style="display: block; margin-top: 20px;"><i class="fas fa-arrow-left"></i> Volver al inicio de sesión</a>
        </div>
    </div>
</body>
</html>
